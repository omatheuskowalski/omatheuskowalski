name: GitHub-Profile-Summary-Cards

on:
  schedule:
    # roda 1x por dia, às 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-summary-cards
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          # Token padrão: conta apenas atividade pública.
          # Para incluir contribuições privadas, crie um Personal Access Token,
          # salve como secret SUMMARY_GITHUB_TOKEN e troque abaixo.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: "main"
          # Horário de Brasília (UTC-3)
          UTC_OFFSET: -3
          AUTO_PUSH: true
